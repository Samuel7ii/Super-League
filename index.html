<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super League: Fantasy Draft Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* ============ SUPER LEAGUE — late-2000s console football manager look ============ */
:root{--c1:#1167c7;--c2:#fff;--bg:#0c1015;--p1:#1d242d;--p2:#161c23;--line:#2e3946;--line2:#435163;--tx:#e8edf2;--mut:#8b98a7;
 --hi1:#45b4ff;--hi2:#1469c9;--ok:#7bcf2a;--bad:#e5483f;--gold:#f0b429;--amber:#f2c94c;
 --t-icon:#ff4b3e;--t-gold:#ff9d2e;--t-silver:#f3d23b;--t-bronze:#67c23a}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.5 'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;min-height:100vh;
 background:radial-gradient(ellipse 80% 60% at 50% -10%,#24303d 0%,transparent 70%),repeating-linear-gradient(135deg,#ffffff03 0 2px,transparent 2px 6px),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;margin:0;letter-spacing:.02em}
h1{font-size:46px;line-height:1}h2{font-size:28px;line-height:1.1;text-transform:uppercase}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:#dfe6ee}
a.pl{color:var(--tx);cursor:pointer;text-decoration:none;font-weight:600}a.pl:hover{color:var(--hi1)}
a.link{color:var(--hi1);cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.yr{color:var(--mut);font-weight:600;font-size:.85em}.yr.big{font-size:.7em}
.muted{color:var(--mut)}.fine{color:var(--mut);font-size:13px;line-height:1.45}.warn{color:var(--bad)}.okc{color:var(--ok)}.gold{color:var(--gold)}
.center{text-align:center;justify-content:center}.block{display:block}
/* buttons */
.btn{background:linear-gradient(180deg,#4b5867,#323d4a);color:#fff;border:1px solid #5d6b7c;border-radius:2px;padding:9px 16px;font:600 13px 'Barlow Semi Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff26}
.btn:hover{background:linear-gradient(180deg,var(--hi1),var(--hi2));border-color:#8fd0ff}
.btn:disabled{opacity:.4;cursor:not-allowed;background:linear-gradient(180deg,#4b5867,#323d4a)}
.btn.lime{background:linear-gradient(180deg,var(--hi1),var(--hi2));border-color:#8fd0ff}.btn.lime:hover{background:linear-gradient(180deg,#6cc6ff,#1b7be0)}
.btn.red{background:linear-gradient(180deg,#c23a36,#8c1f1f);border-color:#e06a63}
.btn.ghost{background:transparent;border-color:var(--line2)}.btn.sm{padding:5px 10px;font-size:12px}.btn.big{padding:13px 30px;font-size:16px}.btn.full{width:100%;margin-top:8px}.btn.on{background:linear-gradient(180deg,var(--hi1),var(--hi2))}
.btn.more{grid-column:1/-1;justify-self:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* header */
header{position:sticky;top:0;z-index:20}
.topbar{display:flex;align-items:center;gap:22px;padding:8px 18px;background:linear-gradient(180deg,#2a333e,#151a20);border-bottom:2px solid var(--hi2);box-shadow:0 4px 14px #000a;flex-wrap:wrap}
.mode{cursor:pointer;display:flex;flex-direction:column;line-height:1}.mode b{font:700 24px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.04em}.mode span{margin-top:3px;align-self:flex-start;background:var(--hi2);font:600 10px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.2em;padding:2px 6px}
.club{display:flex;gap:10px;align-items:center;padding-left:18px;border-left:1px solid var(--line2)}.club b{font:600 19px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em}.club small{display:block;color:var(--mut);font-size:12px}
.date,.money{display:flex;flex-direction:column;line-height:1.1;padding:4px 14px;background:#0c1015;border:1px solid var(--line)}
.date small,.money small{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.14em}.date b{font:600 18px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase}.money b{font:600 18px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--ok)}
.acts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
/* shell: side menu + main */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 110px)}
nav{background:linear-gradient(180deg,#161c23,#10151b);border-right:1px solid var(--line);padding:12px 0 60px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
.navttl{font:600 11px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.24em;color:var(--mut);padding:4px 18px 10px}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #222a33;color:#c6d0db;padding:11px 18px;font:600 14px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
nav button:hover{background:#232c37;color:#fff}
nav button.on{background:linear-gradient(90deg,var(--hi1),var(--hi2) 70%,#0e4c94);color:#fff;box-shadow:inset 0 1px 0 #ffffff40}
nav button.on:after{content:'▶';font-size:10px}
nav em{background:var(--bad);color:#fff;font-style:normal;font-size:11px;padding:0 6px;border-radius:2px}
nav .navsys{margin-top:14px;border-top:1px solid #222a33;color:var(--mut);font-size:12px}
main{padding:20px 22px 70px;min-width:0;max-width:1300px}
/* PS-style prompt bar */
.prompts{position:fixed;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;justify-content:flex-end;gap:22px;padding:0 22px;background:linear-gradient(180deg,#1e252d,#0b0e12);border-top:1px solid var(--line2);z-index:30;font:600 13px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#d6dee7}
.pr{display:flex;align-items:center;gap:7px;cursor:pointer}.pr:hover{color:#fff}
.pr i{width:20px;height:20px;border-radius:50%;background:#0b0e12;border:1px solid #57636f;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700}
.b-x:before{content:'✕';color:#7ab6ff}.b-o:before{content:'○';color:#ff6b6b;font-size:13px}.b-tri:before{content:'△';color:#53d18a}.b-sq:before{content:'□';color:#ff8ad8}.b-st:before{content:'≡';color:#ddd}
/* panels */
.card{background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-top-color:var(--line2);border-radius:2px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0006}
.card>h3,.card>.hrow:first-child{margin:-16px -16px 14px;padding:8px 14px;background:linear-gradient(180deg,#2d3743,#222a34);border-bottom:1px solid #3d4a59;box-shadow:inset 4px 0 0 var(--hi1);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card>.hrow:first-child h3,.card>.hrow:first-child h2{margin:0}.card>.hrow:first-child h2{font-size:18px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.hrow h3,.hrow h2{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid3>.card{margin:0}.span2{grid-column:span 2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols{display:flex;gap:16px;align-items:flex-start}.grow{flex:1;min-width:0}.side{width:320px;flex-shrink:0}.side.wide{width:430px}
.pitchcard{flex:1;min-width:0}
/* crests & small tags */
.crest{vertical-align:middle;flex-shrink:0}.crest.fa{display:inline-block;background:#333;padding:1px 5px;font-size:11px}
.ovr{display:inline-block;min-width:30px;text-align:center;font:700 15px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;padding:0 5px;background:#0d1116;border:1px solid #36414e;border-radius:2px}
.t-icon{color:var(--t-icon)}.t-gold{color:var(--t-gold)}.t-silver{color:var(--t-silver)}.t-bronze{color:var(--t-bronze)}
.pos{display:inline-block;min-width:34px;text-align:center;font:700 12px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.04em;padding:1px 4px;margin-right:7px;color:#fff;border-radius:1px}
.g-GK{background:#e0a400;color:#1c1300}.g-DEF{background:#2f7fe0}.g-MID{background:#3aa856}.g-ATT{background:#d8403a}.pos.lg{font-size:18px;padding:6px 8px}
.cond{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#0d1116;font-style:normal;font-weight:800;font-size:13px;margin-right:5px;vertical-align:middle}
.cond.c1{color:#ff3b30}.cond.c2{color:#ff9500}.cond.c3{color:#c9d400}.cond.c4{color:#3a8dff}.cond.c5{color:#a66bff}
.ycard,.rcard{display:inline-block;width:9px;height:12px;border-radius:1px;vertical-align:-1px;margin:0 2px}.ycard{background:#f5cf2b}.rcard{background:#e5302a}
.inj{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin:0 3px;background:linear-gradient(#e5302a,#e5302a) center/12px 4px no-repeat,linear-gradient(#e5302a,#e5302a) center/4px 12px no-repeat}
.asst{display:inline-block;font:700 10px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;background:#3a8dff;color:#fff;padding:0 3px;margin:0 2px;border-radius:1px;font-style:normal}
.key{display:inline-block;font:700 9px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.1em;background:var(--gold);color:#1c1300;padding:0 4px;margin-left:3px;font-style:normal}
.cap{background:var(--amber);color:#1c1300;font:700 10px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;padding:0 4px;margin-left:4px}.cap.pk{background:#8b98a7}
.leg{color:var(--gold)}.fit{font-weight:700}
.pill{display:inline-block;background:#26303b;border:1px solid #3a4655;padding:1px 9px;font-size:12px;font-weight:600;margin:2px;border-radius:1px}
.pill.okb{background:#1d3a14;border-color:#3f6e22;color:#b7ef84}.pill.badb{background:#3d1716;border-color:#7a2a27;color:#ffb4ae}.pill.gold{background:var(--gold);border-color:var(--gold);color:#1c1300}
.rk{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;background:#0d1116;border:1px solid #36414e;font:600 13px 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.rt{font:700 13px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;padding:0 6px;margin-left:6px;border-radius:1px}.r5{background:#2f7fe0;color:#fff}.r4{background:#3aa856;color:#fff}.r3{background:#9cc32a;color:#13200a}.r2{background:#e0a400;color:#1c1300}.r1{background:#d8403a;color:#fff}
.fm{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;font:700 11px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-style:normal;margin-right:2px}.fm.W{background:#3aa856}.fm.D{background:#69737e}.fm.L{background:#d8403a}
/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--mut);font:600 12px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:7px 9px;background:#1a2028;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:1}
.tbl td{padding:7px 9px;border-bottom:1px solid #242d37}.tbl.big td{padding:9px}.tbl tbody tr:nth-child(even) td{background:#ffffff04}
.tbl tr:hover td{background:linear-gradient(90deg,#45b4ff40,#45b4ff08)!important}
.tbl tr.mine td{background:#f2c94c14!important}.tbl tr.mine td:first-child{box-shadow:inset 3px 0 var(--amber)}
.tbl tr.xi td:first-child{box-shadow:inset 3px 0 var(--hi1)}.tbl tr.dim{opacity:.4}.tbl tr.off{opacity:.35}
.tbl tr.po .rk{background:var(--hi2);border-color:var(--hi1);color:#fff}.tbl .hl{color:var(--hi1)}.tbl.mini td{padding:5px 6px;font-size:14px}
.tscroll{max-height:640px;overflow:auto}.tscroll.short{max-height:420px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{background:#0d1116;color:var(--tx);border:1px solid #3a4655;border-radius:2px;padding:7px 10px;font:14px 'Barlow Semi Condensed',Arial,sans-serif}
select:focus,input:focus{outline:1px solid var(--hi1)}
.chip{background:#232b35;border:1px solid #3a4655;color:#c6d0db;padding:5px 12px;font:600 13px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.06em;cursor:pointer;border-radius:1px}
.chip.on{background:linear-gradient(180deg,var(--hi1),var(--hi2));border-color:#8fd0ff;color:#fff}.chip.coach{border-color:#2a8a7a}
.tog{display:inline-flex;gap:7px;align-items:center;color:#c6d0db;font-size:14px}
/* draft */
.clock{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#26303b,#1a2028);border:1px solid var(--line2);padding:14px 18px;margin-bottom:12px}
.clock.me{border-color:var(--hi1);box-shadow:inset 4px 0 0 var(--hi1)}.clock-l{display:flex;gap:14px;align-items:center}.clock small{color:var(--mut)}.clock h2{font-size:26px}
.dtimer{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid var(--hi1);background:#0d1116;line-height:1}.dtimer b{font:700 24px 'Barlow Condensed','Arial Narrow',Arial,sans-serif}.dtimer small{font-size:9px;letter-spacing:.1em;text-transform:uppercase}.dtimer.paused{border-color:var(--mut);opacity:.6}
.justpicked{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 16px;margin-bottom:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--k1) 30%,#1a2028),#1a2028 60%);border:1px solid var(--line);animation:jp .35s ease-out}
.justpicked.mine{border-color:var(--hi1)}.justpicked.big{border-color:var(--gold)}
.jp-l{display:flex;gap:14px;align-items:center}.jp-l small{color:var(--hi1);font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase}.jp-l h2{font-size:22px;margin:2px 0}.jp-l p{margin:0;color:#c6d0db;font-size:14px}
.jp-ovr{display:flex;flex-direction:column;align-items:center;font:700 38px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;line-height:1;padding:6px 14px;background:#0d1116;border:1px solid #36414e}.jp-ovr small{font-size:12px;color:var(--mut)}
@keyframes jp{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.futgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.fut{position:relative;background:linear-gradient(180deg,#252e38,#1a2028);border:1px solid #36414e;border-top:3px solid #67c23a;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--tx)}
.fut:hover{border-color:var(--hi1);background:linear-gradient(180deg,#2b3846,#1d2630)}
.fut.t-icon{border-top-color:var(--t-icon)}.fut.t-gold{border-top-color:var(--t-gold)}.fut.t-silver{border-top-color:var(--t-silver)}.fut.t-bronze{border-top-color:var(--t-bronze)}
.fut.t-icon .fut-top b{color:var(--t-icon)}.fut.t-gold .fut-top b{color:var(--t-gold)}.fut.t-silver .fut-top b{color:var(--t-silver)}.fut.t-bronze .fut-top b{color:var(--t-bronze)}
.fut-top{display:flex;justify-content:space-between;align-items:flex-start}.fut-top div{display:flex;align-items:baseline;gap:6px}.fut-top b{font:700 32px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;line-height:1}.fut-top span{font:700 13px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--mut)}.fut-top small{color:var(--mut);font-size:12px;font-weight:600}
.fut-name{font:600 18px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fut-yr{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut-attrs{display:flex;gap:4px;margin:7px 0 3px;border-top:1px solid #36414e;padding-top:6px}.fut-attrs span{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut);letter-spacing:.06em}.fut-attrs b{font:700 16px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--tx)}
.fut-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:5px}
.fut.coachc{border-top-color:#2bb3a0}.fut.coachc .fut-top b{color:#2bd3bd}.fut.coachc .fut-attrs b{font-size:13px}
.fut.mini{cursor:default;padding:8px}.fut.mini .fut-top b{font-size:22px}.fut.mini .fut-name{font-size:15px}
.need{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #242d37}.coachline{padding-bottom:8px}
.mypicks{margin-top:10px;max-height:340px;overflow:auto}.mypicks div,.feedmini div{padding:6px 0;border-bottom:1px solid #242d37;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mypickslist{margin:10px 0;display:flex;flex-wrap:wrap;gap:3px}
.feedmini{max-height:420px;overflow:auto}.feedmini small{color:var(--mut);margin-right:4px}
/* setup */
.setup{max-width:1100px;margin:0 auto;padding:30px 18px 70px}
.hero{text-align:center;padding:36px 0 26px}.hero h1{font:700 92px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.04em;line-height:.9}.hero h1 span{color:var(--hi1)}.hero p{max-width:620px;margin:14px auto;color:#c6d0db;font-size:17px}
.kicker{color:var(--hi1);font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.clubpick{display:flex;flex-direction:column;align-items:center;gap:5px;background:linear-gradient(180deg,#252e38,#1a2028);border:1px solid #36414e;color:var(--tx);padding:12px 6px;cursor:pointer;font:600 15px 'Barlow Semi Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.clubpick:hover{border-color:var(--hi1)}.clubpick small{color:var(--mut);font-weight:400;font-size:11px;text-transform:none}.clubpick.on{background:linear-gradient(180deg,var(--hi1),var(--hi2));border-color:#8fd0ff}.clubpick.on small{color:#e3f2ff}
.rulesline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.rulesline p{margin:0;color:#c6d0db}
.go{text-align:center;margin:22px 0}.resume{display:flex;justify-content:space-between;align-items:center;border-color:var(--hi1)}
/* home */
.home{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.hcol>.card{margin-bottom:16px}
.matchday{text-align:center;padding:22px;background:linear-gradient(180deg,#26303b,#1a2028);position:relative;overflow:hidden}
.matchday:before,.matchday:after{content:'';position:absolute;top:0;bottom:0;width:8px}.matchday:before{left:0;background:var(--h1)}.matchday:after{right:0;background:var(--a1)}
.md-k{display:inline-block;background:#0d1116;border:1px solid var(--line2);font:600 12px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:3px 12px}
.md{display:flex;align-items:center;justify-content:center;gap:30px;margin:18px 0 8px}.md-mid{display:flex;flex-direction:column;align-items:center;font:600 26px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase}.md-mid span{color:var(--mut);font-size:14px;letter-spacing:.3em;margin:2px 0}
.md-info{color:var(--mut);font-size:13px;margin-bottom:14px}
.derby{display:inline-block;margin-left:8px;background:#b3261e;color:#fff;font:600 12px 'Barlow Semi Condensed',Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:3px 12px}
.tip{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.score{display:flex;align-items:center;justify-content:center;gap:16px;font:700 40px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;padding:4px}.scorers{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:13px;color:#c6d0db;gap:10px;margin:4px 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #242d37;font-size:14px}.kv span{color:var(--mut)}
.bar{display:inline-block;width:120px;height:8px;background:#0d1116;border:1px solid #36414e;overflow:hidden;vertical-align:middle}.bar i{display:block;height:100%}
.lrow{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid #242d37;font-size:14px}.lrow b{margin-left:auto;font:600 16px 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.msg{padding:8px 0;border-bottom:1px solid #242d37;font-size:14px}.msg.act{background:#1c2a3a;margin:0 -8px;padding:8px;box-shadow:inset 3px 0 0 var(--hi1)}.msg .row{margin-top:7px}
.click{cursor:pointer}

  return `${S.playoffs ? `<div class="card">${bracketHTML()}</div>` : ''}<div class="card"><h3>Your season</h3><div class="fxstrip">${strip}</div><p class="fine">✕ = crossover match against the other conference.</p></div>
  <div class="card"><div class="hrow"><h3>Gameweek ${g + 1}</h3><div class="row"><button class="btn sm" ${g <= 0 ? 'disabled' : ''} onclick="U.gwView=${g - 1};render()">◀</button><button class="btn sm" ${g >= NGW - 1 ? 'disabled' : ''} onclick="U.gwView=${g + 1};render()">▶</button></div></div>
  <div class="matches">${list.map((m, i) => `<div class="match ${m.h === S.userTeam || m.a === S.userTeam ? 'mine' : ''} ${played ? 'click' : ''}" ${played ? `onclick="openReport(${g},${i})"` : ''}><span class="t r">${S.teams[m.h].name} ${crest(S.teams[m.h], 'sm')}</span><b class="sc">${played ? `${m.hg} - ${m.ag}` : 'v'}</b><span class="t">${crest(S.teams[m.a], 'sm')} ${S.teams[m.a].name}</span>${m.x ? '<small class="xtag">crossover</small>' : derbyName(m.h, m.a) ? `<small class="xtag">${derbyName(m.h, m.a)}</small>` : ''}</div>`).join('')}</div></div>`;
}
function bracketHTML() {
  const po = S.playoffs;
  const tieHTML = (t, ri, ti) => `<div class="tie">${[t.hi, t.lo].map(id => `<div class="${t.winner === id ? 'win' : t.winner !== null ? 'out' : ''} ${id === S.userTeam ? 'mine' : ''}">${crest(S.teams[id], 'sm')}<span>${S.teams[id].name}</span><small>${S.teams[id].conf}${confPos(id)}</small><b>${t.legs.map(l => l.h === id ? l.hg : l.ag).join(' · ')}</b></div>`).join('')}${t.legs.length ? `<a class="link fine" onclick="openPOReport(${ri},${ti},${t.legs.length - 1})">Report${t.legs[t.legs.length - 1].pens ? ' · pens ' + t.legs[t.legs.length - 1].pens.join('-') : t.legs[t.legs.length - 1].aet ? ' · aet' : ''}</a>` : ''}</div>`;
  const cols = [0, 1, 2].map(ri => po.rounds[ri] ? `<div class="bcol"><small>${po.names[ri]}</small>${po.rounds[ri].map((t, ti) => tieHTML(t, ri, ti)).join('')}</div>` : `<div class="bcol"><small>${po.names[ri]}</small><div class="tie tbd">TBD</div></div>`).join('');

function openPOReport(r, t, l) { showReport(S.playoffs.rounds[r][t].legs[l], `${S.playoffs.names[r]} · leg ${l + 1}`); }
function openReport(g, i) { if (i < 0) return; showReport(S.results[g][i], `Gameweek ${g + 1}`); }
function showReport(m, title) {
  const order = 'GK LB LWB CB RB RWB DM CM LM RM AM LW RW ST'.split(' ');
  const side = s => Object.entries(m.ps).filter(([id, v]) => v.side === s).sort((a, b) => (a[1].sub - b[1].sub) || (order.indexOf(a[1].slot) - order.indexOf(b[1].slot)));
  const full = Object.values(m.ps)[0] && Object.values(m.ps)[0].tk !== undefined;
  const col = s => `<div class="rcol">${side(s).map(([id, v]) => `<div class="${+id === m.motm ? 'motm' : ''}">${posChip(v.slot)}${pn(P[id], 'short')}${v.sub ? `<small class="muted"> (${v.min}')</small>` : ''} ${'⚽'.repeat(v.g)}${'<i class="asst">A</i>'.repeat(v.a)}${v.yc ? '<i class="ycard"></i>' : ''}${v.rc ? '<i class="rcard"></i>' : ''}${+id === m.motm ? ' ★' : ''}<b class="rt ${rtc(v.rt)}">${v.rt.toFixed(1)}</b>${full ? `<small class="muted det">${P[id].pos === 'GK' ? `${v.sv} saves · ${(v.psxg - v.ga) >= 0 ? '+' : ''}${(v.psxg - v.ga).toFixed(1)} goals prevented` : `${v.kp} key passes · ${v.drs}/${v.dra} dribbles · ${v.tk + v.int} tackles+int · ${v.pas ? Math.round(v.pc / v.pas * 100) : 0}% passing`}</small>` : ''}</div>`).join('')}</div>`;
  openModal(`<small class="muted">${title}</small>
    <div class="rhead" style="--h1:${S.teams[m.h].c1};--a1:${S.teams[m.a].c1}">${crest(S.teams[m.h], 'xl')}<div><div class="big">${m.hg} – ${m.ag}</div>${m.aet ? '<small>after extra time</small>' : ''}${m.pens ? `<small>${m.pens[0]}-${m.pens[1]} on penalties</small>` : ''}</div>${crest(S.teams[m.a], 'xl')}</div>
    <div class="rnames"><b>${S.teams[m.h].name}</b><b>${S.teams[m.a].name}</b></div>
    <div class="goals">${goalsLine(m)}</div>
    <div class="mstats">${[['Possession', m.poss + '%', (100 - m.poss) + '%'], ['Shots', m.hsh, m.ash], ['On target', m.hsot, m.asot]].map(([k, a, b]) => `<div class="msr"><b>${a}</b><span>${k}</span><b>${b}</b></div>`).join('')}<div class="msr small"><b>${m.hxg.toFixed(1)}</b><span>xG</span><b>${m.axg.toFixed(1)}</b></div></div>
    <div class="motmline">★ Man of the Match: ${pn(P[m.motm])} · ${m.ps[m.motm].rt.toFixed(1)}</div>
    <div class="rcols">${col(0)}${col(1)}</div>`, 'wide');
}

// ---------- clubs ----------
function vClubs() {
  const id = U.clubView === null ? S.userTeam : U.clubView; const t = S.teams[id]; const co = S.coaches[t.coach];
  if (t.squad.length) validateLineup(t);
  const slots = FORMS[t.tactics.form]; const ch = t.lineup && t.lineup.length ? teamChem(t) : null;
  const sq = t.squad.map(i => P[i]).sort((a, b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos) || b.ovr - a.ovr);
  const xi = new Set(t.lineup || []);
  const bench = sq.filter(p => !xi.has(p.id));
  const tac = ['ment', 'press', 'tempo', 'width', 'line', 'pass'].map(k => `<span class="pill">${labelOf(k)}: <b>${t.tactics[k]}</b></span>`).join('');
  const pitch = t.squad.length ? `<div class="pitch">${slots.map((s, i) => { const pid = t.lineup[i]; const p = pid !== null && pid !== undefined ? P[pid] : null; return `<div class="slot g-${SLOT_GROUP(s[0])} ${p && posPen(p.pos, s[0]) > 3 ? 'oop' : ''}" style="left:${s[1]}%;bottom:${pby(s[2])}%" ${p ? `onclick="openPlayer(${p.id})"` : ''}><span class="ovr t-${tier(p ? p.ovr : 60)}">${p ? p.ovr : '?'}</span><b>${p ? esc(DB[p.id].short) : 'empty'}</b><small>${s[0]}${p ? ' · ' + yrTag(p.y) : ''}${p && t.captain === p.id ? ' · ©' : ''}${p && untouchable(p) ? ' <i class="key">KEY</i>' : ''}</small></div>`; }).join('')}</div>` : '<p class="muted">No players yet.</p>';
  return `<div class="card"><div class="clubsel">${S.teams.map(x => `<button class="${x.id === id ? 'on' : ''}" onclick="U.clubView=${x.id};render()" title="${x.name}">${crest(x, 'sm')}</button>`).join('')}</div></div>
  <div class="card clubhead" style="--k1:${t.c1}"><div class="hrow"><div class="row">${crest(t, 'xl')}<div><h2>${t.name}</h2><small class="muted">${CONF_NAME[t.conf]}${S.table ? ' · ' + ord(confPos(id)) : ''} · budget ${fm(t.budget)}</small></div></div>${S.legacy.club[id] ? `<span class="pill gold">${S.legacy.club[id].titles} title${S.legacy.club[id].titles !== 1 ? 's' : ''}</span>` : ''}</div></div>
  <div class="cols tac">
    <div class="card pitchcard"><div class="hrow"><h3>How they line up · ${t.tactics.form}</h3>${S.table && S.table[id] ? `<span>${S.table[id].form.map(f => `<i class="fm ${f}">${f}</i>`).join('')}</span>` : ''}</div>${pitch}<p class="fine">Tap a player to see his profile, or to make an offer.</p></div>
    <div class="side wide">
      <div class="card"><h3>Dugout</h3>${co ? coachCard(co) : '<p class="warn">Caretaker in charge</p>'}
        <div class="tacpills">${tac}</div></div>
      ${ch ? `<div class="card chem"><div class="hrow"><h3>Chemistry</h3><span class="chemscore ${ch.score >= 70 ? 'good' : ch.score >= 50 ? 'mid' : 'bad'}">${ch.score}</span></div>
        <div class="kv"><span>Avg football IQ</span><b>${ch.iq.toFixed(0)}</b></div>
        ${ch.links.length ? `<div class="links">${ch.links.slice(0, 6).map(([a, b, c]) => `<span class="pill okb">${esc(DB[a].short)} + ${esc(DB[b].short)}</span>`).join('')}</div>` : ''}
        ${ch.lazy >= 2 ? `<p class="warn">${ch.lazy} forwards who don't press, so expect open games.</p>` : ''}</div>` : ''}
      <div class="card"><h3>Bench & reserves</h3>${bench.map(p => `<div class="lrow">${posChip(p.pos)}${pn(p, 'short')}${p.inj ? ' <i class="inj"></i>' : ''}${p.sus ? ' <i class="rcard"></i>' : ''}<b>${ob(p.ovr)}</b></div>`).join('') || '<p class="muted">Nobody on the bench.</p>'}</div>
    </div></div>
  <details class="card"><summary>Full squad stats</summary><div class="tscroll"><table class="tbl big"><thead><tr><th>Pos</th><th>Player</th><th>Age</th><th>OVR</th><th>IQ</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Avg</th></tr></thead><tbody>
  ${sq.map(p => `<tr class="${xi.has(p.id) ? 'xi' : ''}"><td>${posChip(p.pos)}</td><td>${pn(p)} ${untouchable(p) ? '<i class="key">KEY</i>' : ''} ${DB[p.id].clubs.some(c => c[0] === t.name) ? '<span class="leg">★</span>' : ''}</td><td>${p.age}</td><td>${ob(p.ovr)}</td><td>${p.iq}</td><td>${p.st.app}</td><td>${p.st.g}</td><td>${p.st.a}</td><td>${p.st.app ? (p.st.rt / p.st.app).toFixed(2) : '–'}</td></tr>`).join('')}
  </tbody></table></div><p class="fine"><i class="key">KEY</i> = untouchable: the club won't sell or trade him.</p></details>`;
}

// ---------- legacy recap ----------
function vLegacy() {
  const ids = Object.keys(S.legacy.p).map(Number).map(id => [id, legacyScore(id)]).sort((a, b) => b[1] - a[1]);
  const top = ids.slice(0, 15); const goat = top[0]; const L0 = S.legacy.p[goat[0]];
  const clubs = Object.entries(S.legacy.club).sort((a, b) => b[1].titles - a[1].titles || b[1].shields - a[1].shields).slice(0, 6);
  const coaches = Object.entries(S.legacy.coach).sort((a, b) => b[1].titles - a[1].titles).slice(0, 5);
  const h = S.history; const uTitles = h.filter(x => x.userChamp).length; const avgPos = h.reduce((s, x) => s + x.userPos, 0) / h.length;
  let bestSeason = null; S.players.forEach(p => p.career.forEach(c => { if (!bestSeason || c.g > bestSeason.g) bestSeason = Object.assign({ id: p.id }, c); }));
  const byPos = g => ids.filter(([id]) => POS_GROUP[DB[id].pos] === g);
  const allTime = [['GK', 1], ['DEF', 4], ['MID', 3], ['ATT', 3]].flatMap(([g, n]) => byPos(g).slice(0, n).map(x => [x[0], g]));
  const ln = id => S.legacy.p[id];
  return `<div class="card goat"><small class="kicker">The ${S.history.length}-season reality is over</small><h1>The GOAT of this reality</h1>
    <div class="goatrow"><div class="goatname"><h2>${esc(DB[goat[0]].name)}</h2><p>${L0.g} goals · ${L0.a} assists · ${L0.app} apps · ${L0.bdo} Ballon d'Or${L0.bdo !== 1 ? 's' : ''} · ${L0.titles} title${L0.titles !== 1 ? 's' : ''}</p><div class="legscore">Legacy score <b>${Math.round(goat[1])}</b></div></div></div></div>
  <div class="grid3"><div class="card span2"><h3>Legacy rankings</h3><div class="tscroll"><table class="tbl big"><thead><tr><th>#</th><th>Player</th><th>Legacy</th><th></th><th></th><th>Goals</th><th>Assists</th><th>Apps</th><th>Avg</th></tr></thead><tbody>
    ${top.map(([id, sc], i) => { const l = ln(id); return `<tr><td><span class="rk">${i + 1}</span></td><td>${posChip(DB[id].pos)}<a class="pl" onclick="openPlayer(${id})">${esc(DB[id].name)}</a></td><td><b class="okc">${Math.round(sc)}</b></td><td>${l.bdo}</td><td>${l.titles}</td><td>${l.g}</td><td>${l.a}</td><td>${l.app}</td><td>${(l.rt / l.app).toFixed(2)}</td></tr>`; }).join('')}</tbody></table></div><p class="fine">The legacy score adds up goals, assists, appearances, ratings, Ballon d'Ors, top-3 finishes, titles, Teams of the Season and Golden Boots, across every version of a player.</p></div>
   <div class="card"><h3>Your manager career</h3><div class="kv"><span>Club</span><b>${me().name}</b></div><div class="kv"><span>Titles</span><b>${uTitles} </b></div><div class="kv"><span>Playoff appearances</span><b>${h.filter(x => x.userPO).length}</b></div><div class="kv"><span>Avg conference finish</span><b>${avgPos.toFixed(1)}</b></div><div class="kv"><span>Verdict</span><b>${uTitles >= 3 ? 'Dynasty builder ' : uTitles >= 1 ? 'Champion manager' : avgPos <= 4 ? 'Solid contender' : 'Sacked in most realities '}</b></div>
   <h3 style="margin-top:18px">Dynasties</h3>${clubs.map(([id, c]) => `<div class="lrow">${crest(S.teams[id], 'sm')} ${S.teams[id].name}<b>${c.titles} · ${c.shields} </b></div>`).join('')}
   <h3 style="margin-top:18px">Best coaches</h3>${coaches.map(([id, c]) => `<div class="lrow">${S.coaches[id].name}<b>${c.titles} </b></div>`).join('')}
   ${bestSeason ? `<h3 style="margin-top:18px">Record</h3><div class="lrow">Most goals in a season: ${esc(DB[bestSeason.id].name)} '${String(bestSeason.y).slice(2)}<b>${bestSeason.g}</b></div>` : ''}</div></div>
  <div class="card"><h3>All-time XI of this reality</h3><div class="atxi">${allTime.map(([id, g]) => `<div class="fut mini k-${k2(Math.min(99, 80 + Math.round(legacyScore(id) / 40)))[1]}"><div class="fut-top"><div><b>${Math.round(legacyScore(id))}</b><span>${g}</span></div></div><div class="fut-name">${esc(DB[id].short)}</div></div>`).join('')}</div></div>
  <div class="card"><h3>Ballon d'Or roll of honour</h3><div class="potm">${S.history.map(x => `<div class="award"><small>Season ${x.season}</small><div><b>${esc(DB[x.ballon].name)}</b></div><span class="muted">Champions: ${S.teams[x.champion].name}</span></div>`).join('')}</div></div>
  <div class="center"><button class="btn lime big" onclick="newGameUI()">Start a new reality ▶</button></div>`;
}

// ---------- player modal ----------
const pby = y => 7 + y * 0.86;
function hexRadar(vals, names) {
  const cx = 110, cy = 100, R = 78; const pt = (i, r) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const ring = f => vals.map((_, i) => pt(i, R * f).join(',')).join(' ');
  const shape = vals.map((v, i) => pt(i, R * Math.max(0.15, (v - 30) / 69)).join(',')).join(' ');
  return `<svg class="hex" viewBox="0 0 220 200">${[1, .75, .5, .25].map(f => `<polygon points="${ring(f)}" class="hr"/>`).join('')}${vals.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" class="hr"/>`).join('')}
  <polygon points="${shape}" class="hs"/>${vals.map((v, i) => { const [x, y] = pt(i, R + 15); return `<text x="${x}" y="${y + 4}" text-anchor="middle" class="ht">${names[i]} <tspan class="hv">${v}</tspan></text>`; }).join('')}</svg>`;
}
function openPlayer(id) {
  const p = P[id]; const d = DB[id]; const t = p.team >= 0 ? S.teams[p.team] : null; const mine = p.team === S.userTeam; const s = p.st;
  const names = p.pos === 'GK' ? GK_N : ATTR_N;
  const realYears = []; for (let y = d.start; y <= Math.min(d.retire, Math.max(d.realEnd, p.y)); y++) realYears.push(y);
  let act = '';
  if (!isDrafting() && S.phase !== 'over') {
    if (mine) act = `<div class="row"><button class="btn" onclick="me().captain=${id};save();closeModal();render()">© Make captain</button>${p.pos !== 'GK' ? `<button class="btn" onclick="me().pk=${id};save();closeModal();render()">Penalty taker</button>` : ''}<button class="btn lime" onclick="getSellOffers(${id})">Find buyers</button><button class="btn" onclick="P[${id}].listed=!P[${id}].listed;save();closeModal();render()">${p.listed ? 'Remove from list' : 'Transfer-list'}</button><button class="btn red" onclick="closeModal();res(releasePlayer(${id}))">Release</button></div><div id="sellbox"></div>`;
    else if (p.team === -1) act = `<div class="row"><button class="btn lime" onclick="closeModal();res(userBid(${id},0))">Sign free agent (${fm(p.val * 0.15)} signing-on fee)</button></div>`;
    else if (p.team >= 0) {
      if (untouchable(p)) act = `<div class="dealbox"><b><i class="key">KEY</i> ${t.name} consider him untouchable.</b><p class="fine">Key players and club legends are not for sale or trade, at any price.</p></div>`;
      else { const n = S.nego[id]; const ask = n && n.ask ? n.ask : askingPrice(p); act = `<div class="dealbox"><div class="hrow"><b>Negotiate with ${t.name}</b><span class="muted">Their price: <b class="okc">${fm(ask)}</b>${!windowOpen() ? ' <span class="warn">· window closed</span>' : ''}</span></div>
       ${n && n.hist.length ? `<div class="nego">${n.hist.map(([w, v]) => `<span class="${w}">${w === 'you' ? 'You' : t.short}: €${v}m</span>`).join('')}</div>` : ''}
       <div class="row"><input id="bidamt" type="number" step="0.5" value="${r1(ask * 0.85)}"><button class="btn lime" onclick="doBid(${id})">Make offer</button>${n && n.ask ? `<button class="btn" onclick="doBid(${id},${n.ask})">Accept their €${n.ask}m</button>` : ''}<button class="btn" onclick="openTrade(${id})">Propose trade</button></div></div>`; }
    }
  }
  openModal(`<div class="phead k-${k2(p.ovr)[1]}"><div class="k-tier">${k2(p.ovr)[2]}</div><div class="ovrbig">${p.ovr}<small>${p.pos}</small></div><div class="grow"><h2>${esc(d.name)} <span class="yr big">'${String(p.y).slice(2)}</span></h2><small>${d.nat} · age ${p.age} · ${p.y}/${String(p.y + 1).slice(2)} version (${esc(p.rclub)}) · ${t ? t.name : p.team === -2 ? 'Retired' : 'Free agent'}</small>
    <div class="row pmeta"><span class="pill">IQ ${p.iq}</span><span class="pill">${p.wr === 'Low' ? '' : p.wr === 'High' ? '' : ''} Work rate: ${p.wr}</span><span class="pill">${condA(p)} Morale ${Math.round(p.mor)}</span><span class="pill">${fm(p.val)}</span>${p.req ? '<span class="pill badb">Wants out</span>' : ''}</div></div>${t ? crest(t, 'xl') : ''}</div>
   <div class="grid2">
    <div><h3>Attributes</h3>${hexRadar(p.attrs, names)}${p.attrs.map((v, i) => `<div class="attr"><span>${names[i]}</span><span class="abar"><i style="width:${v}%;background:${v >= 85 ? 'var(--ok)' : v >= 70 ? 'var(--gold)' : 'var(--mut)'}"></i></span><b>${v}</b></div>`).join('')}
     <div class="tags">${[...d.tags].map(c => TAG_NAMES[c]).filter(Boolean).map(x => `<span class="pill">${x}</span>`).join('')}</div></div>
    <div><h3>Season ${S.season}</h3><div class="sgrid">${(p.pos === 'GK' ? [['Apps', s.app], ['Clean sheets', s.cs], ['Saves', s.sv], ['Conceded', s.ga], ['Avg rating', s.app ? (s.rt / s.app).toFixed(2) : '–'], ['MOTM', s.motm], ['Goals prevented', (s.psxg - s.ga).toFixed(1)], ['TOTW', s.totw]] :
      [['Apps', s.app], ['Goals', s.g], ['Assists', s.a], ['Avg rating', s.app ? (s.rt / s.app).toFixed(2) : '–'], ['MOTM', s.motm], ['TOTW', s.totw], ['Shots', `${s.sh} (${s.sot})`], ['Key passes', s.kp], ['Dribbles', `${s.drs}/${s.dra}`], ['Tackles + int', s.tk + s.int], ['Pass %', s.pas ? Math.round(s.pc / s.pas * 100) + '%' : '–'], ['Cards', `${s.yc}<i class="ycard"></i> ${s.rc}<i class="rcard"></i>`]]).map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>
     ${p.pos !== 'GK' ? `<p class="fine">Advanced: xG ${s.xg.toFixed(1)} · xA ${s.xa.toFixed(1)}</p>` : ''}</div>
   </div>
   <h3>Real career arc</h3><div class="arc">${realYears.map(y => { const r = rateAt(d, y); return `<div class="${y === p.y ? 'cur' : ''} ${y > 2026 ? 'proj' : ''}" title="${y}: ${y <= 2026 ? realClubAt(d, y) : 'projected'}"><b>${r}</b><i style="height:${(r - 50) * 2}px"></i><small>${String(y).slice(2)}</small></div>`; }).join('')}</div>
   <p class="fine">${d.clubs.map(c => `${esc(c[0])} (${c[1]})`).join(' → ')}. Each new season moves him one real year along this curve. When he retires, a new random version of him re-enters the free-agent pool.</p>
   ${p.career.filter(c => c.app).length ? `<h3>Super League career</h3><table class="tbl"><thead><tr><th>Season</th><th>Version</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Avg</th></tr></thead><tbody>${p.career.filter(c => c.app).map(c => `<tr><td>${c.season}</td><td>'${String(c.y).slice(2)} (${c.ovr})</td><td>${c.team >= 0 ? S.teams[c.team].name : '–'}</td><td>${c.app}</td><td>${c.g}</td><td>${c.a}</td><td>${c.rt}</td></tr>`).join('')}</tbody></table>` : ''}
   <details class="editr"><summary>Edit his rating</summary><div class="row"><input id="edov" type="number" min="40" max="99" value="${p.ovr}"><button class="btn sm" onclick="editRating(${id},'year')">This version only ('${String(p.y).slice(2)})</button><button class="btn sm" onclick="editRating(${id},'career')">Shift his whole career</button></div><p class="fine">Disagree with a rating? Change it here. "Shift his whole career" moves every year of his curve by the same amount.</p></details>
   ${act}`, 'wide');
}
function doBid(id, amt) { const a = amt !== undefined ? amt : +document.getElementById('bidamt').value; const r = userBid(id, a); toast(r.msg, r.ok); save(); if (r.ok) { closeModal(); render(); } else openPlayer(id); }
function getSellOffers(id) {
  if (!windowOpen()) { $('#sellbox').innerHTML = '<p class="warn">The transfer window is closed.</p>'; return; }
  const o = sellOffers(id);
  $('#sellbox').innerHTML = o.length ? `<div class="dealbox">${o.map(x => `<div class="offer">${crest(S.teams[x.team], 'sm')} ${S.teams[x.team].name} offer <b class="okc">${fm(x.fee)}</b> <button class="btn sm lime" onclick="closeModal();res(acceptSale(${id},${x.team},${x.fee}))">Accept</button></div>`).join('')}</div>` : '<p class="muted">No club can afford him right now.</p>';
}
function openTrade(targetId) {
  const tgt = P[targetId]; const T = S.teams[tgt.team]; U.trade = U.trade && U.trade.t === targetId ? U.trade : { t: targetId, give: [], cash: 0 };
  const tr = U.trade; const e = evalTrade(targetId, tr.give, tr.cash);
  openModal(`<h2>Trade for ${esc(DB[targetId].name)} ${yrTag(tgt.y)}</h2><p class="muted">${T.name} value him at about <b>${fm(askingPrice(tgt) * 1.05)}</b> in a trade. They value your players based on what they need.</p>
   <div class="tscroll short"><table class="tbl">${me().squad.map(id => P[id]).sort((a, b) => b.ovr - a.ovr).map(p => `<tr class="click ${tr.give.includes(p.id) ? 'mine' : ''}" onclick="toggleGive(${p.id})"><td>${tr.give.includes(p.id) ? '' : ''}</td><td>${posChip(p.pos)}${esc(DB[p.id].name)} ${yrTag(p.y)}</td><td>${ob(p.ovr)}</td><td>${fm(tradeValueFor(T, p))}</td></tr>`).join('')}</table></div>
   <div class="row" style="margin-top:12px"><label class="tog">+ Cash (€m) <input type="number" min="0" step="0.5" value="${tr.cash}" onchange="U.trade.cash=Math.max(0,+this.value);openTrade(${targetId})"></label></div>
   <div class="dealbox"><div class="kv"><span>Your offer is worth</span><b>${fm(e.got || 0)}</b></div><div class="kv"><span>They want</span><b>${fm(e.want || askingPrice(tgt) * 1.05)}</b></div>${e.msg ? `<p class="${e.accept ? 'okc' : 'warn'}">${e.msg}</p>` : `<p class="okc">${T.name} would accept this.</p>`}</div>
   <div class="row"><button class="btn lime" ${e.accept ? '' : 'disabled'} onclick="const r=doTrade(${targetId},U.trade.give,U.trade.cash);U.trade=null;closeModal();res(r)">Propose trade</button><button class="btn" onclick="openPlayer(${targetId})">Back</button></div>`, 'wide');
}
function toggleGive(id) { const tr = U.trade; tr.give = tr.give.includes(id) ? tr.give.filter(x => x !== id) : tr.give.concat([id]); openTrade(tr.t); }

// ---------- modal ----------
function openModal(html, cls) { $('#modal').innerHTML = `<div class="mbg" onclick="closeModal()"></div><div class="mbox ${cls || ''}"><button class="mx" onclick="closeModal()" aria-label="Close">✕</button>${html}</div>`; $('#modal').style.display = 'block'; if (!U.mHist && !U.backPending) { try { history.pushState({ m: 1 }, ''); U.mHist = true; } catch (e) { } } }
const modalOpen = () => $('#modal').style.display === 'block';
window.addEventListener('popstate', () => {
  if (U.backPending) { U.backPending = false; if (modalOpen() && !U.mHist) { try { history.pushState({ m: 1 }, ''); U.mHist = true; } catch (e) { } } return; }
  if (U.mHist) { U.mHist = false; if (U.live) { try { history.pushState({ m: 1 }, ''); U.mHist = true; } catch (e) { } return; } closeModal(); }
});
function closeModal() { if (U.live) return; $('#modal').style.display = 'none'; $('#modal').innerHTML = ''; if (U.mHist) { U.mHist = false; U.backPending = true; history.back(); } if (S && U.scenAfter) { setTimeout(() => { if (S.breaking && S.breaking.length) showBreaking(); else { U.scenAfter = false; showScenario(); } }, 60); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function migrate() { if (!S.draft) return; if (!S.draft.owner) { const d = S.draft; d.kind = d.kind || 'initial'; d.rounds = d.rounds || DRAFT_ROUNDS; d.owner = []; for (let r = 0; r < d.rounds; r++) for (let i = 0; i < 30; i++) d.owner.push(r % 2 === 0 ? d.order[i] : d.order[29 - i]); d.total = d.owner.length; } S.edits = S.edits || {}; }
(function boot() { if (load() && S.v === 2) { migrate(); U.tab = isDrafting() ? 'draft' : S.phase === 'over' ? 'legacy' : 'home'; } else S = null; render(); })();

</script></body></html>
